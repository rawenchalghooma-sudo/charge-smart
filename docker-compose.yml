services:
  mysql:
    image: mysql:8.0
    container_name: chargesmart_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: solarplug_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: chargesmart_backend
    restart: always
    depends_on:
      - mysql
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: solarplug_db
      DB_USER: root
      DB_PASSWORD: 1234
      JWT_SECRET: solarplug_super_secret
      JWT_EXPIRES_IN: 7d
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC: chargesmart/station/data
    ports:
      - "5001:5000"

  mqtt:
    image: eclipse-mosquitto:2
    container_name: chargesmart_mqtt
    restart: always
    ports:
      - "1884:1883"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chargesmart_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: chargesmart_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  mysql_data: